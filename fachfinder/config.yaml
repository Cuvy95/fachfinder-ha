name: Fachfinder
version: "1.1.0"
slug: fachfinder
description: Virtuelle Sortierkästen in 3D – finde jedes Bauteil, jede Schraube, jedes Fach
url: https://github.com/cuvy95/fachfinder-ha
image: "ghcr.io/cuvy95/{arch}-fachfinder"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:archive-search
panel_title: Fachfinder
# Optional: Direktzugriff ohne HA (z. B. für QR-Codes). Standardmäßig aus.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direktzugriff (ohne HA-Login – nur im Heimnetz nutzen!)
